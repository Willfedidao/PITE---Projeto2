{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{ 'Criar conta' if register else 'Bem-vindo de volta' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">{% if register %}<label>Nome<input name="nome" autocomplete="name" required maxlength="120"></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel" required maxlength="30"></label>{% endif %}<label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Senha{% if register %} (mínimo de 8 caracteres){% endif %}<input name="senha" type="password" minlength="8" autocomplete="{{ 'new-password' if register else 'current-password' }}" required></label><button>{{ 'Cadastrar' if register else 'Entrar' }}</button></form></section>{% endblock %}
